<!doctype html>
<html lang="nb">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Øya">
  <meta name="theme-color" content="#0b0f14">
  <title>Øya i hundre år</title>
  <link rel="stylesheet" href="spill.css">
</head>
<body>
  <!-- Velg spiller -->
  <section id="velg" class="velg">
    <h1>🏝️ Øya i hundre år</h1>
    <p class="under">Hvem skal spille?</p>
    <div id="profilliste" class="profilliste"></div>
    <button id="ny-spiller" class="stor-knapp">➕ Ny spiller</button>
    <p class="smaa"><a href="proveark.html">Prøvearket</a> · fase T1 (trykkmotoren)</p>
  </section>

  <dialog id="ny" class="kort">
    <h2>Ny spiller</h2>
    <label class="navnefelt">Navn <input id="ny-navn" maxlength="16" autocomplete="off" placeholder="Hva heter du?"></label>
    <p class="etikett">Velg et dyr</p>
    <div id="ny-avatar" class="valgrad avatarer"></div>
    <p class="etikett">Hvem spiller?</p>
    <div id="ny-nivaa" class="valgrad"></div>
    <div class="knapper">
      <button id="ny-avbryt">Avbryt</button>
      <button id="ny-start" class="hoved">Seil til øya ⛵</button>
    </div>
  </dialog>

  <!-- Spillet -->
  <main id="spill" class="spill" hidden>
    <header class="topp">
      <button id="meny-knapp" class="rund" aria-label="Meny"></button>
      <div class="himmel">
        <canvas id="himmel"></canvas>
        <span id="dag"></span>
        <span id="sol-tall"></span>
      </div>
      <button id="sangbok-knapp" class="rund" aria-label="Sangboka">🎵</button>
    </header>
    <canvas id="lerret"></canvas>
    <footer id="forrad" class="forrad"></footer>
  </main>

  <!-- Nærbilde av en ting -->
  <div id="naer" class="naer" hidden>
    <div class="naer-boks">
      <div id="naer-tittel" class="naer-tittel"></div>
      <canvas id="naer-lerret"></canvas>
      <button id="naer-lukk" class="rund lukk" aria-label="Lukk">✕</button>
    </div>
  </div>

  <!-- Natta -->
  <div id="natt" class="natt" hidden>
    <canvas id="natt-lerret"></canvas>
    <div class="natt-tekst">🌙 ✨</div>
    <button id="morgen" class="stor-knapp">☀️ God morgen</button>
  </div>

  <dialog id="meny" class="kort">
    <h2 id="meny-tittel"></h2>
    <div class="menyknapper">
      <button id="meny-sov">🌙 Legg deg nå</button>
      <button id="meny-nivaa"></button>
      <button id="meny-lyd"></button>
      <button id="meny-bytt">👥 Bytt spiller</button>
      <button id="meny-ny-oy">🏝️ Ny øy</button>
      <button id="meny-slett">🗑️ Slett spilleren</button>
      <button id="meny-lukk" class="hoved">Tilbake til øya</button>
    </div>
  </dialog>

  <dialog id="sangbok" class="kort">
    <h2>🎵 Sangboka</h2>
    <p id="sangbok-tekst"></p>
    <div id="sangliste" class="sangliste"></div>
    <button id="sangbok-lukk" class="hoved">Lukk</button>
  </dialog>

  <div id="melding" class="melding" hidden></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
