<!doctype html>
<html lang="nb">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Skatteøya – byggekatalog</title>
  <link rel="icon" type="image/png" sizes="64x64" href="ikon/favicon-64.png">
  <link rel="icon" type="image/png" sizes="32x32" href="ikon/favicon-32.png">
  <link rel="apple-touch-icon" href="ikon/ikon-180.png">
  <style>
    body { margin: 0; background: #0b0f14; color: #faf2db; font-family: system-ui, sans-serif; padding: 16px; }
    h1 { font-size: 22px; text-align: center; }
    .galleri { display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; }
    figure { margin: 0; text-align: center; }
    figcaption { font-size: 14px; color: #cfc6ad; margin-top: 4px; }
    a { color: #ffd23f; }
    .topplinje { position: sticky; top: 0; z-index: 5; display: flex; justify-content: space-between; gap: 10px; padding: 8px 0; background: inherit; }
    .tilbake, .bytt {
      display: inline-flex; align-items: center; min-height: 48px; padding: 6px 18px; border-radius: 14px; font-size: 18px; font-weight: 700; text-decoration: none;
    }
    .tilbake { background: #ffe58a; color: #2b2a26; border: 2px solid #d9a520; }
    .bytt { background: #1f2735; color: #faf2db; border: 2px solid #3a4558; }
    body.neon .tilbake { background: #ff2bd6; color: #fff; border-color: #ff9cf0; box-shadow: 0 0 12px rgba(255, 43, 214, 0.6); }
    .versjon { position: fixed; right: 8px; bottom: 2px; font-size: 11px; color: #9a917b; pointer-events: none; }
    body { padding-bottom: 24px; }
    body.neon { background: #07020f; }
    body.neon figcaption { color: #7ff3ff; text-shadow: 0 0 6px #19e3ff; }
  </style>
</head>
<body>
  <nav class="topplinje">
    <a class="tilbake" href="index.html">← Tilbake til spillet</a>
    <a id="bytt" class="bytt" href="?neon">Vis neon</a>
  </nav>
  <h1>Byggekatalog – alle bygg (trykk på et bygg)</h1>
  <div id="galleri" class="galleri"></div>
  <script type="module">
    // Alle byggene, levende: den faste delen tegnes én gang, det som beveger seg hele tiden.
    import { BYGG, HAVN, BAAT, SKOLE, MUSEUM, OPPFINNELSER } from './js/data/ting.js';
    import { PYNT, LIV } from './js/stil/pynt.js';
    import { tegnTomtKort } from './js/stil/ruter.js';
    import { lagTilfeldig } from './js/rng.js';
    import { settNeon, neonKontekst, glod } from './js/stil/neon.js';
    import { visVersjon } from './js/versjon.js';
    visVersjon();
    // ?neon viser byggene slik de ser ut på neonøya.
    const neon = new URLSearchParams(location.search).has('neon');
    settNeon(neon);
    if (neon) document.body.classList.add('neon');
    document.getElementById('bytt').href = neon ? '?' : '?neon';
    document.getElementById('bytt').textContent = neon ? 'Vis vanlig' : 'Vis neon';
    const S = 180, dpr = devicePixelRatio || 1;
    const kort = [...BYGG, HAVN, BAAT, SKOLE, MUSEUM, ...OPPFINNELSER].map((b, k) => {
      const fast = document.createElement('canvas');
      fast.width = fast.height = S * dpr;
      const fctx = neonKontekst(fast.getContext('2d'));
      fctx.scale(dpr, dpr);
      tegnTomtKort(fctx, S, lagTilfeldig(k + 1), ['iglo', 'snomann', 'havn', 'havnbaat'].includes(b.id) ? 'strand' : 'eng', () => PYNT[b.id](fctx, S, lagTilfeldig(k + 7)));
      const c = document.createElement('canvas');
      c.width = c.height = S * dpr;
      c.style.width = c.style.height = `${S}px`;
      const f = document.createElement('figure');
      f.append(c);
      f.insertAdjacentHTML('beforeend', `<figcaption>${b.navn} · ${b.pris ? `${b.pris} 🪙` : 'gratis'}</figcaption>`);
      document.getElementById('galleri').append(f);
      let fest = Infinity;
      c.onclick = () => { fest = 0; };
      return { b, fast, c, ctx: neonKontekst(c.getContext('2d')), fest: () => fest, tikk: (dt) => { fest += dt; } };
    });
    let sist = performance.now();
    function tegn(ms) {
      const dt = (ms - sist) / 1000;
      sist = ms;
      for (const k of kort) {
        k.tikk(dt);
        k.ctx.setTransform(1, 0, 0, 1, 0, 0);
        k.ctx.drawImage(k.fast, 0, 0);
        k.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        LIV[k.b.id]?.(k.ctx, S, ms / 1000, k.fest());
        glod(k.c);
      }
      requestAnimationFrame(tegn);
    }
    requestAnimationFrame(tegn);
  </script>
</body>
</html>
